version: '3.8'

networks:
    tc_bridge:
        external: true
#---------------------------------------------------------------------------------

services:

    nextcloud-24-apache:
        
        depends_on:
            - redis
            - db
        
        image: localhost:5000/nextcloud:24.0.2-apache  
        hostname: 'nextcloud'
        container_name: 'nextcloud'        
        restart: unless-stopped
        
        networks:
            tc_bridge:
                ipv4_address: 192.168.3.19
        ports:
            - "2219:22"
            - "8019:80"
            - "4419:443"
        
        environment:
            - POSTGRES_DB=nextcloud
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=$$Pvand88S$$
            - POSTGRES_HOST=postgres
            - NEXTCLOUD_ADMIN_USER=nextcloud
            - NEXTCLOUD_ADMIN_PASSWORD=$$Nvand88D$$
            - REDIS_HOST=redis
            - NEXTCLOUD_TRUSTED_DOMAINS=nextcloud.thricecrowned.com
            - POSTGRES_DB=nextcloud

        volumes:
            - ./nextcloud:/var/www/html:rw
#---------------------------------------------------------------------------------       
    postgres:
    
        image: localhost:5000/postgres:13-bullseye
        hostname: 'postgres'
        container_name: 'postgres'
        restart: unless-stopped
        
        networks:
            tc_bridge:
                ipv4_address: 192.168.3.15        
        ports:
            - "54315:5432"
        
        environment:
        - POSTGRES_DB=nextcloud
        - POSTGRES_USER=postgres
        - POSTGRES_PASSWORD=$$Pvand88S$$
        - postgresql:/var/lib/postgresql/data
        
        volumes:
            - ./postgres:/var/lib/postgresql/data
#---------------------------------------------------------------------------------

    redis:
    
        image: localhost:5000/redis:latest
        hostname: 'redis'
        container_name: 'redis'
        networks:
            tc_bridge:
                ipv4_address: 192.168.3.20

        volumes:
            - redis:/var/lib/redis        
#---------------------------------------------------------------------------------

volumes:
    nextcloud:
    postgres:
    redis:
